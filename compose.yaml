services:
  repoknow:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - repoknow-data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  repoknow-data:
