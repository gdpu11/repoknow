name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: |
        Do not include Tokens, passwords, private source, database files, or authenticated client configuration.
        Use a public minimal reproduction when possible. Report security issues through the private channel described in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, RepoKnow version, native process or container.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove secrets, personal paths, internal addresses, and private repository names.
