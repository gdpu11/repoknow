name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git nodejs
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run regression tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
      - name: Check public source inventory and redaction
        run: uv run --locked python scripts/prepare_release.py --check
