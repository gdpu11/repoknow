[project]
name = "repoknow"
version = "0.1.0"
description = "Self-hosted, model-free knowledge base for GitHub and GitLab repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge-base", "gitlab", "github", "mcp", "code-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=45,<47",
  "markdown-it-py>=3,<5",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-java>=0.23,<0.24",
]

[project.urls]
Homepage = "https://github.com/gdpu11/repoknow"
Repository = "https://github.com/gdpu11/repoknow"
Issues = "https://github.com/gdpu11/repoknow/issues"

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
